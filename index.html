<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Plus Academy</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--pr:#4f46e5;--ok:#15803d;--bad:#b91c1c;--wa:#b45309;--bd:#e5e7eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f28;--tx:#eceef4;--mu:#9aa0b0;--pr:#818cf8;--ok:#4ade80;--bad:#f87171;--wa:#fbbf24;--bd:#2c303c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1c1f28;--tx:#eceef4;--mu:#9aa0b0;--pr:#818cf8;--ok:#4ade80;--bad:#f87171;--wa:#fbbf24;--bd:#2c303c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}
.w{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:17px;margin:18px 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--mu)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--pr);border:1px solid var(--bd)}button.d{background:transparent;color:var(--bad);padding:4px 8px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.s{cursor:pointer}.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.wa{color:var(--wa)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.note{background:var(--card);border:1px solid var(--bad);border-radius:10px;padding:8px;font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
const $=s=>document.querySelector(s);
function toast(m){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;font-size:14px;max-width:90%";document.body.appendChild(t)}t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2500)}
window.alert=toast;
let armed=null,bf=null,bm="",ss="grade",sf="",ed=null,pe=null,ts="name",tfl="";
function sure(k){if(armed===k){armed=null;return true}armed=k;toast("Tap again to confirm delete");setTimeout(()=>{armed=null},3000);return false}
const D={students:[],teachers:[],expenses:[],categories:[],bills:[],attendance:[]};
let tab="students",cur=null,q="",gf="",db=null,offline=false;
const today=()=>new Date().toISOString().slice(0,10);
const mon=()=>today().slice(0,7);
const sum=(a,k,f)=>(a||[]).filter(f||(()=>1)).reduce((t,x)=>t+(+x[k]||0),0);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>{n=+n||0;return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en")};
const paidOf=s=>sum(s.payments,"amount");
const addM=(d,n)=>{const [y,m,dd]=d.split("-").map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(dd,last));return t.toISOString().slice(0,10)};
const kOf=s=>Math.floor(paidOf(s)/(+s.fee));
const partialOf=s=>Math.round((paidOf(s)-kOf(s)*(+s.fee))*100)/100;
const nextDue=s=>s.startDate&&+s.fee>0?addM(s.startDate,kOf(s)+1):null;
const isOpen=s=>s.startDate&&+s.fee>0&&today()>=addM(s.startDate,kOf(s));
const daysTo=s=>isOpen(s)?Math.round((Date.parse(nextDue(s))-Date.parse(today()))/864e5):null;
const status=s=>{if(!(s.startDate&&+s.fee>0))return["No fee set","mu"];if(today()<s.startDate)return["Starts "+s.startDate,"mu"];const d=daysTo(s);if(d===null)return["Paid until "+addM(s.startDate,kOf(s)),"ok"];const pl=partialOf(s),lf=pl>0?" \u00b7 "+fmt((+s.fee)-pl)+" left":"";if(d<0)return["Overdue "+(-d)+"d"+lf,"bad"];if(d===0)return["Due today"+lf,"wa"];if(d<=3)return["Due in "+d+"d"+lf,"wa"];return pl>0?["Partial"+lf,"wa"]:["Pending \u00b7 pay by "+nextDue(s),"mu"]};
const dueBanner=()=>{const n=D.bills.filter(b=>/^(Overdue|Due today)/.test(bStatus(b).t)).length+D.students.filter(s=>daysTo(s)!==null&&daysTo(s)<=0).length+D.teachers.filter(t=>/^(Overdue|Due today)/.test(tStatus(t)[0])).length;return n&&tab!=="overview"&&tab!=="students"?`<div class="note" style="border-color:var(--wa);cursor:pointer" onclick="go('overview')">🔔 ${n} payment(s) due or overdue — tap to see</div>`:""};
const GR=Array.from({length:12},(_,i)=>i+1);

async function init(){
  try{db=await claude.use("db")}catch(e){db=null}
  if(db){
    const t=setTimeout(()=>{offline=true;render()},10000);
    Object.keys(D).forEach(k=>db.collection(k).onSnapshot(s=>{clearTimeout(t);D[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{clearTimeout(t);offline=true;render()}));
  }else{
    offline=true;
    try{Object.assign(D,JSON.parse(localStorage.getItem("aplus2")||"{}"))}catch(e){}
  }
  render();
}
async function save(k,o){
  const {id,...data}=o;
  if(db&&!offline){try{await db.collection(k).doc(id).set(data)}catch(e){alert("Could not save (you may not have edit permission).")}}
  else{const i=D[k].findIndex(x=>x.id===id);i<0?D[k].push(o):D[k][i]=o;try{localStorage.setItem("aplus2",JSON.stringify(D))}catch(e){}render()}
}
async function remove(k,id){
  if(!sure("r"+id))return;
  if(db&&!offline){try{await db.collection(k).doc(id).delete()}catch(e){alert("Could not delete.")}}
  else{D[k]=D[k].filter(x=>x.id!==id);try{localStorage.setItem("aplus2",JSON.stringify(D))}catch(e){}}
  cur=null;render();
}
const uid=()=>"i"+Date.now().toString(36);
function go(t){tab=t;cur=null;q="";render();scrollTo(0,0)}

function render(){
  const tabs=[["students","Students"],["teachers","Teachers"],["attendance","Attendance"],["payments","Payments"],["exams","Exams"],["expenses","Expenses"],["overview","Overview"]];
  $("#app").innerHTML=dueBanner()+(offline?'<div class="note">⚠️ Shared saving is unavailable. Data is saved on this device only.</div>':"")+
  `<h1>🎓 A Plus Academy</h1><div class="tabs">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join("")}</div>`+
  `<div id="main">${{students:students,teachers:teachers,attendance:attendance,payments:payPage,exams:examsPage,expenses:expenses,overview:overview}[tab]()}</div>`;
}

/* ---------- Students ---------- */
function students(){
  const s=D.students.find(x=>x.id===cur);if(s)return studentFile(s);
  const all=D.students,od=all.filter(s=>daysTo(s)!==null&&daysTo(s)<0).length,ds=all.filter(s=>daysTo(s)!==null&&daysTo(s)>=0&&daysTo(s)<=3).length;
  return `<div class="stats" style="grid-template-columns:1fr"><div class="stat"><b>${all.length}</b><span>Students</span></div>
  
  </div>
  <input placeholder="Search name or phone" value="${esc(q)}" oninput="q=this.value;$('#list').innerHTML=sList()">
  <select onchange="setSort(this.value)"><option value="grade" ${ss==='grade'?'selected':''}>Sort: By grade (1 → 12)</option><option value="name" ${ss==='name'?'selected':''}>Sort: A → Z</option>${GR.map(g=>`<option value="g${g}" ${ss==='g'+g?'selected':''}>Only Grade ${g}</option>`).join("")}</select>
  <button onclick="sForm()" style="width:100%;margin-bottom:10px">+ New student</button><div id="form"></div><div id="list">${sList()}</div>`;
}
function setSort(v){ss=v;gf=/^g\d+$/.test(v)?v.slice(1):"";$('#list').innerHTML=sList()}
const sSort=(a,b)=>{const nm=(a.name||"").localeCompare(b.name||""),g=(+a.grade||0)-(+b.grade||0),u=(status(b)[1]==="ok"?0:1)-(status(a)[1]==="ok"?0:1);return ss==="name"?nm:ss==="unpaid"?(u||g||nm):ss==="paid"?(-u||g||nm):(g||nm)};
function sList(){
  const l=D.students.filter(s=>((s.name||"")+(s.phone||"")).toLowerCase().includes(q.toLowerCase())&&(!gf||s.grade==gf)&&(!sf||(sf==="paid")===(status(s)[1]==="ok")))
    .sort(sSort);
  if(!l.length)return '<p class="mu" style="text-align:center">No students yet</p>';
  return l.map(s=>{const [t,c]=status(s);return `<div class="card s" onclick="cur='${s.id}';render();scrollTo(0,0)"><div class="row"><b>${esc(s.name)}</b><span class="mu">Grade ${esc(s.grade)}</span></div>
  </div>`}).join("");
}
function sForm(){
  $("#form").innerHTML=`<div class="card"><input id="n" placeholder="Student name"><input id="ph" placeholder="Phone" inputmode="tel">
  <div class="g2"><select id="gr">${GR.map(g=>`<option value="${g}">Grade ${g}</option>`).join("")}</select><input id="f" type="number" inputmode="decimal" placeholder="Monthly fee ($)"></div>
  <div class="mu">Start date</div><input id="d" type="date" value="${today()}">
  <div class="mu" style="margin-bottom:8px">Each month runs from the start date (e.g. 15/10 to 15/11). The student must pay within that month. Record the payment when he pays.</div><div class="g2"><button onclick="sCreate()">Save</button><button class="g" onclick="$('#form').innerHTML=''">Cancel</button></div></div>`;
}
function sCreate(){
  const name=$("#n").value.trim();if(!name)return alert("Enter the student name");
  save("students",{id:uid(),name,phone:$("#ph").value,grade:+$("#gr").value,startDate:$("#d").value,fee:+$("#f").value||0,payments:[],exams:[]});
}
function studentFile(s){
  const p=paidOf(s),r=(+s.fee||0)-p,[t,c]=status(s),ex=s.exams||[];
  const gx=ex.filter(e=>e.score!==""&&e.score!=null),avg=gx.length?Math.round(gx.reduce((a,e)=>a+(+e.score/(+e.max||100)),0)/gx.length*100):null;
  return `<button class="g" onclick="cur=null;render()">← Back</button>
  <h1 style="margin-top:12px">${esc(s.name)} <span class="${c}" style="font-size:14px">● ${t}</span></h1>
  <div class="card"><div class="mu">Grade ${esc(s.grade)} · 📞 ${esc(s.phone||"-")}</div><div class="mu">Start date: ${esc(s.startDate||"-")} · Monthly fee ${fmt(s.fee)}</div><button class="g" style="margin-top:8px" onclick="ed=ed==='${s.id}'?null:'${s.id}';render()">Edit student</button>${ed===s.id?editS(s):''}</div>
  <div class="stats"><div class="stat"><b>${fmt(s.fee)}</b><span>Monthly fee</span></div><div class="stat"><b class="ok">${fmt(p)}</b><span>Total paid</span></div>
  <div class="stat"><b class="${c}" style="font-size:15px">${esc(nextDue(s)||"-")}</b><span>Pay by</span></div></div>
  <div class="card row"><span>This month</span><b>${isOpen(s)?fmt(partialOf(s))+" / "+fmt(s.fee)+" paid \u00b7 "+fmt((+s.fee)-partialOf(s))+" left":"Fully paid \u2713"}</b></div>
  ${attCard(s)}<h2>💰 Payments</h2>${pePanel('students',s,'payments')}<div class="card t"><table>${(s.payments||[]).map((x,i)=>`<tr><td>${esc(x.date)}</td><td>${fmt(x.amount)}</td><td><button class="g" style="padding:4px 8px" onclick="pEdit('students','${s.id}','payments',${i})">✎</button><button class="d" onclick="delItem('students','${s.id}','payments',${i})">✕</button></td></tr>`).join("")||'<tr><td class="mu">No payments yet</td></tr>'}</table>
  <div class="g2" style="margin-top:8px"><input id="pd" type="date" value="${today()}"><input id="pa" type="number" inputmode="decimal" placeholder="Amount $ (smaller = partial)" value="${isOpen(s)?(+s.fee)-partialOf(s):(s.fee||'')}"></div>
  <button onclick="addP('${s.id}')">+ Add payment</button></div>
  <h2>📝 Exams & grades ${avg!==null?`<span class="mu">(average ${avg}%)</span>`:""}</h2>
  <div class="card t"><table>${ex.map((x,i)=>`<tr><td>${esc(x.name)}<div class="mu">${esc(x.date)}</div></td><td><b>${x.score===""||x.score==null?'<span class="wa">Not graded</span>':esc(x.score)+'/'+esc(x.max)}</b></td><td><button class="d" onclick="delItem('students','${s.id}','exams',${i})">✕</button></td></tr>`).join("")||'<tr><td class="mu">No exams yet</td></tr>'}</table>
  <input id="en" placeholder="Exam name" style="margin-top:8px"><div class="g2"><input id="ed" type="date" value="${today()}"><input id="es" type="number" inputmode="decimal" placeholder="Score"></div>
  <input id="em" type="number" inputmode="decimal" placeholder="Maximum score" value="100"><button onclick="addE('${s.id}')">+ Add exam</button></div>
  <button class="d" style="margin:12px 0" onclick="remove('students','${s.id}')">Delete student</button>`;
}
function addP(id){const s=D.students.find(x=>x.id===id),a=+$("#pa").value;if(!a)return;save("students",{...s,payments:[...(s.payments||[]),{date:$("#pd").value,amount:a}]})}
function addE(id){const s=D.students.find(x=>x.id===id),n=$("#en").value.trim(),sc=$("#es").value;if(!n||sc==="")return alert("Enter exam name and score");
  save("students",{...s,exams:[...(s.exams||[]),{name:n,date:$("#ed").value,score:+sc,max:+$("#em").value||100}]})}
function delItem(k,id,f,i){const o=D[k].find(x=>x.id===id);if(!sure(f+id+i))return;const a=[...(o[f]||[])];a.splice(i,1);save(k,{...o,[f]:a})}

/* ---------- Teachers ---------- */
function monthPaid(t,m){return sum(t.payments,"amount",x=>(x.forMonth||(x.date||"").slice(0,7))===m)}
const tDueDay=t=>+t.dueDay||(t.startDate?+t.startDate.slice(8,10):1)||1;
const tDue=t=>addM(mon()+"-"+String(tDueDay(t)).padStart(2,"0"),0);
const tStatus=t=>{if(!(+t.salary>0))return["No salary set","mu"];if(monthPaid(t,mon())>=+t.salary)return["Paid this month","ok"];if(t.startDate&&today()<t.startDate)return["Starts "+t.startDate,"mu"];const d=Math.round((Date.parse(tDue(t))-Date.parse(today()))/864e5);if(d<0)return["Overdue "+(-d)+"d","bad"];if(d===0)return["Due today","wa"];if(d<=3)return["Due in "+d+"d","wa"];return["Pending \u00b7 due "+tDue(t),"mu"]};
function teachers(){
  const t=D.teachers.find(x=>x.id===cur);if(t)return teacherFile(t);
  const due=D.teachers.reduce((a,t)=>a+Math.max((+t.salary||0)-monthPaid(t,mon()),0),0);
  return `<div class="stats"><div class="stat"><b>${D.teachers.length}</b><span>Teachers</span></div>
  <div class="stat"><b>${fmt(sum(D.teachers,"salary"))}</b><span>Monthly salaries</span></div>
  <div class="stat"><b class="${due?'bad':'ok'}">${fmt(due)}</b><span>Due this month</span></div></div>
  <select onchange="ts=this.value;render()"><option value="name" ${ts==='name'?'selected':''}>Sort: A → Z</option><option value="paid" ${ts==='paid'?'selected':''}>Sort: Paid first</option><option value="unpaid" ${ts==='unpaid'?'selected':''}>Sort: Unpaid first</option></select>
  <button onclick="tForm()" style="width:100%;margin-bottom:10px">+ New teacher</button><div id="form"></div>
  ${tSorted().map(t=>{const [st,sc]=tStatus(t);return `<div class="card s" onclick="cur='${t.id}';render();scrollTo(0,0)"><div class="row"><b>${esc(t.name)}</b><span class="${sc}">${st}</span></div>
  <div class="mu">${esc(t.subject||"")} · Salary ${fmt(t.salary)}/month</div><div class="mu">Started ${esc(t.startDate||"-")} · Salary due ${tDue(t)}</div><button class="${tStatus(t)[1]==='ok'?'g':''}" style="margin-top:8px;width:100%" onclick="event.stopPropagation();tMark('${t.id}')">${tStatus(t)[1]==='ok'?'Mark unpaid':'✓ Mark paid'}</button></div>`}).join("")||'<p class="mu" style="text-align:center">No teachers yet</p>'}`;
}
function tForm(){
  $("#form").innerHTML=`<div class="card"><input id="n" placeholder="Teacher name"><input id="ph" placeholder="Phone" inputmode="tel">
  <div class="g2"><input id="sb" placeholder="Subject"><input id="sl" type="number" inputmode="decimal" placeholder="Monthly salary ($)"></div>
  <div class="mu">Start date</div><input id="d" type="date" value="${today()}">
  <input id="dd" type="number" min="1" max="31" inputmode="numeric" placeholder="Payment due day each month (1-31)"><div class="g2"><button onclick="tCreate()">Save</button><button class="g" onclick="$('#form').innerHTML=''">Cancel</button></div></div>`;
}
function tCreate(){const name=$("#n").value.trim();if(!name)return alert("Enter the teacher name");
  save("teachers",{id:uid(),name,phone:$("#ph").value,subject:$("#sb").value,salary:+$("#sl").value||0,startDate:$("#d").value,dueDay:+$("#dd").value||0,payments:[]})}
function teacherFile(t){
  const m=mon(),mp=monthPaid(t,m),rem=(+t.salary||0)-mp;
  return `<button class="g" onclick="cur=null;render()">← Back</button><h1 style="margin-top:12px">${esc(t.name)}</h1>
  <div class="card"><div class="mu">${esc(t.subject||"-")} · 📞 ${esc(t.phone||"-")}</div><div class="mu">Started: ${esc(t.startDate||"-")}</div><div class="mu">Salary due: <b class="${tStatus(t)[1]}">${tDue(t)}</b> (day ${tDueDay(t)} of each month) · ${tStatus(t)[0]}</div>
  <div class="g2" style="margin-top:8px"><input id="ddd" type="number" min="1" max="31" inputmode="numeric" placeholder="Change due day (1-31)" style="margin:0"><button class="g" onclick="setDue('${t.id}')">Update</button></div><div class="g2" style="margin-top:8px"><button onclick="tMark('${t.id}')">${tStatus(t)[1]==='ok'?'Mark unpaid':'✓ Mark paid this month'}</button><button class="g" onclick="ed=ed==='${t.id}'?null:'${t.id}';render()">Edit teacher</button></div>${ed===t.id?editT(t):''}</div>
  <div class="stats"><div class="stat"><b>${fmt(t.salary)}</b><span>Salary / month</span></div><div class="stat"><b class="ok">${fmt(mp)}</b><span>Paid (${m})</span></div>
  <div class="stat"><b class="${rem>0?'bad':'ok'}">${fmt(Math.max(rem,0))}</b><span>Due</span></div></div>
  <h2>💵 Salary payments</h2>${pePanel('teachers',t,'payments')}<div class="card t"><table>${(t.payments||[]).slice().map((x,i)=>`<tr><td>${esc(x.date)}</td><td>${fmt(x.amount)}</td><td class="mu">for ${esc(x.forMonth||(x.date||"").slice(0,7))} ${esc(x.note||"")}</td><td><button class="g" style="padding:4px 8px" onclick="pEdit('teachers','${t.id}','payments',${i})">✎</button><button class="d" onclick="delItem('teachers','${t.id}','payments',${i})">✕</button></td></tr>`).join("")||'<tr><td class="mu">No payments yet</td></tr>'}</table>
  <div class="g2" style="margin-top:8px"><input id="pd" type="date" value="${today()}"><input id="pa" type="number" inputmode="decimal" placeholder="Amount ($)" value="${rem>0?rem:''}"></div>
  <div class="mu">Salary for month</div><input id="pm" type="month" value="${mon()}"><input id="pn" placeholder="Note (optional)"><button onclick="tPay('${t.id}')">+ Record salary payment</button></div>
  <button class="d" style="margin:12px 0" onclick="remove('teachers','${t.id}')">Delete teacher</button>`;
}
function tSorted(){return D.teachers.filter(t=>!tfl||(tfl==="paid")===(tStatus(t)[1]==="ok")).sort((a,b)=>{const nm=(a.name||"").localeCompare(b.name||""),u=(tStatus(b)[1]==="ok"?0:1)-(tStatus(a)[1]==="ok"?0:1);return ts==="unpaid"?(u||nm):ts==="paid"?(-u||nm):nm})}
function tMark(id){const t=D.teachers.find(x=>x.id===id),m=mon();
  if(tStatus(t)[1]==="ok"){if(!sure("u"+id))return;save("teachers",{...t,payments:(t.payments||[]).filter(p=>(p.forMonth||(p.date||"").slice(0,7))!==m)});return}
  const rem=(+t.salary||0)-monthPaid(t,m);if(rem<=0)return toast("Set the salary first");
  save("teachers",{...t,payments:[...(t.payments||[]),{date:today(),amount:rem,forMonth:m,note:"Marked paid"}]})}

  const unpaid=D.students.filter(s=>daysTo(s)!==null).sort((a,b)=>daysTo(a)-daysTo(b));
  return `<h2 style="margin-top:0">This month (${m})</h2>
  <div class="stats"><div class="stat"><b class="ok">${fmt(inc)}</b><span>Income<br>of ${fmt(eI)} expected</span></div><div class="stat"><b class="bad">${fmt(sal)}</b><span>Salaries<br>of ${fmt(eS)} due</span></div><div class="stat"><b class="bad">${fmt(ex)}</b><span>Expenses<br>of ${fmt(eE)} expected</span></div></div>
  <div class="card"><div class="row"><b>Net so far</b><b class="${net>=0?'ok':'bad'}">${fmt(net)}</b></div><div class="row" style="margin-top:6px"><b>Expected net</b><b class="${eI-eS-eE>=0?'ok':'bad'}">${fmt(eI-eS-eE)}</b></div><div class="mu">Expected income − salaries − expenses</div></div>
  <h2>🔔 Payments due (${unpaid.length})</h2><div class="mu" style="margin-bottom:6px">Not paid yet for the current month, soonest deadline first</div>
  ${unpaid.map(s=>`<div class="card s" onclick="tab='students';cur='${s.id}';render()"><div class="row"><b>${esc(s.name)}</b><span class="${status(s)[1]}">${status(s)[0]}</span></div><div class="mu">Grade ${esc(s.grade)} · ${fmt(s.fee)} · pay by ${esc(nextDue(s))}</div></div>`).join("")||'<p class="mu">No payments due 🎉</p>'}
  <h2>💵 Teacher salaries (${D.teachers.length})</h2>${D.teachers.map(t=>{const [st,sc]=tStatus(t);return `<div class="card s" onclick="tab='teachers';cur='${t.id}';render()"><div class="row"><b>${esc(t.name)}</b><span class="${sc}">${st}</span></div><div class="mu">Salary ${fmt(t.salary)} · due ${tDue(t)}</div></div>`}).join("")||'<p class="mu">No teachers yet</p>'}
  <h2>🧾 Monthly bills</h2>${D.bills.slice().sort((a,b)=>(+a.dueDay||1)-(+b.dueDay||1)).map(b=>{const st=bStatus(b);return `<div class="card s" onclick="tab='expenses';render()"><div class="row"><b>${esc(b.name)}</b><span class="${st.c}">${st.t}</span></div><div class="mu">${+b.amount?fmt(b.amount)+' expected':'Amount varies'} · due ${st.due}</div></div>`}).join("")||'<p class="mu">No bills yet</p>'}`;
}
init();
</script>
</body>
</html>
